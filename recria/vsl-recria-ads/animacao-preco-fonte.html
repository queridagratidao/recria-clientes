<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:410px;height:400px;background:#0B0B0B;overflow:hidden;font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif;font-weight:700;color:#fff}
#s{position:relative;width:410px;height:400px;background:#0B0B0B;border-top:4px solid #C9A24E}
.abs{position:absolute}
.gold{color:#C9A24E}
.row{position:absolute;left:24px;width:362px;height:78px;display:flex;align-items:center;gap:14px}
.row .v{font-size:44px;position:relative;white-space:nowrap}
.strike{position:absolute;left:-4px;top:52%;height:5px;background:#C9A24E;border-radius:3px;width:0}
svg{display:block}
</style></head><body><div id="s">
<!-- LISTA -->
<div id="list">
 <div class="row" id="r1" style="top:34px"><svg width="62" height="46" viewBox="0 0 62 46"><rect x="2" y="6" width="58" height="34" rx="5" fill="#1d3b26" stroke="#C9A24E" stroke-width="2.5"/><circle cx="31" cy="23" r="9" fill="none" stroke="#C9A24E" stroke-width="2.5"/><text x="31" y="28" text-anchor="middle" font-size="13" fill="#C9A24E" font-family="Liberation Sans">$</text></svg><div class="v">R$ 5.000<div class="strike" id="k1"></div></div></div>
 <div class="row" id="r2" style="top:130px"><svg width="62" height="46" viewBox="0 0 62 46"><rect x="2" y="6" width="58" height="34" rx="5" fill="#1d3b26" stroke="#C9A24E" stroke-width="2.5"/><circle cx="31" cy="23" r="9" fill="none" stroke="#C9A24E" stroke-width="2.5"/><text x="31" y="28" text-anchor="middle" font-size="13" fill="#C9A24E" font-family="Liberation Sans">$</text></svg><div class="v">R$ 3.000<div class="strike" id="k2"></div></div></div>
 <div class="row" id="r3" style="top:226px"><svg width="62" height="46" viewBox="0 0 62 46"><rect x="2" y="6" width="58" height="34" rx="5" fill="#1d3b26" stroke="#C9A24E" stroke-width="2.5"/><circle cx="31" cy="23" r="9" fill="none" stroke="#C9A24E" stroke-width="2.5"/><text x="31" y="28" text-anchor="middle" font-size="13" fill="#C9A24E" font-family="Liberation Sans">$</text></svg><div class="v">R$ 1.000<div class="strike" id="k3"></div></div></div>
</div>
<!-- GRAFICO -->
<div id="chart" class="abs" style="left:0;top:0;width:410px;height:396px">
 <svg width="410" height="396" viewBox="0 0 410 396">
  <line x1="30" y1="300" x2="385" y2="300" stroke="#444" stroke-width="2"/>
  <rect id="b1" x="46" y="60" width="58" height="240" rx="5" fill="#C9A24E" opacity=".55"/>
  <rect id="b2" x="128" y="156" width="58" height="144" rx="5" fill="#C9A24E" opacity=".55"/>
  <rect id="b3" x="210" y="252" width="58" height="48" rx="5" fill="#C9A24E" opacity=".55"/>
  <rect id="b4" x="292" y="294" width="58" height="6" rx="3" fill="#C9A24E"/>
  <path id="ln" d="M75 52 L157 148 L239 244 L321 286" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="400" stroke-dashoffset="400"/>
  <polygon id="ar" points="0,0 -14,-8 -14,8" fill="#fff" transform="translate(321,286) rotate(40)" opacity="0"/>
  <text id="t1" x="75" y="330" text-anchor="middle" font-size="19" fill="#bbb" font-family="Liberation Sans" font-weight="700">5.000</text>
  <text id="t2" x="157" y="330" text-anchor="middle" font-size="19" fill="#bbb" font-family="Liberation Sans" font-weight="700">3.000</text>
  <text id="t3" x="239" y="330" text-anchor="middle" font-size="19" fill="#bbb" font-family="Liberation Sans" font-weight="700">1.000</text>
  <text id="t4" x="321" y="330" text-anchor="middle" font-size="19" fill="#C9A24E" font-family="Liberation Sans" font-weight="700">97</text>
 </svg>
</div>
<!-- PRECO -->
<div id="price" class="abs" style="left:0;top:0;width:410px;height:396px;text-align:center">
 <div id="pv" class="abs gold" style="left:0;width:410px;top:130px;font-size:104px;line-height:1">R$ 97</div>
 <div id="pg" class="abs" style="left:0;width:410px;top:44px;height:120px"></div>
</div>
<!-- CARTAO -->
<div id="card" class="abs" style="left:60px;top:196px;width:290px;height:170px;border-radius:16px;background:linear-gradient(135deg,#C9A24E,#8a6a27);box-shadow:0 8px 24px rgba(0,0,0,.6)">
 <div class="abs" style="left:22px;top:24px;width:48px;height:36px;border-radius:7px;background:#e8d6a0;opacity:.9"></div>
 <div class="abs" style="left:22px;top:84px;font-size:26px;letter-spacing:3px;color:#1a1306">•••• •••• •••• 0097</div>
 <div class="abs" style="left:22px;top:128px;font-size:17px;color:#1a1306">RECRIA ADS</div>
 <div id="x12" class="abs" style="right:-18px;top:-22px;width:92px;height:92px;border-radius:50%;background:#0B0B0B;border:5px solid #C9A24E;color:#C9A24E;display:flex;align-items:center;justify-content:center;font-size:34px">12x</div>
</div>
<div id="cartxt" class="abs" style="left:0;width:410px;top:338px;text-align:center;font-size:25px;opacity:0">em até <span class="gold">12x</span> no cartão</div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function ph(t,a,d){return cl((t-a)/d)}
function render(t){
 // dinheiro 1..3 entram
 [[1.2,'r1','k1',2.4],[3.8,'r2','k2',4.8],[5.5,'r3','k3',6.2]].forEach(([a,r,k,s])=>{
   const p=ph(t,a,.45),e=back(p);
   $(r).style.opacity=cl(p*2);
   $(r).style.transform=`translateX(${(1-ease(p))*60}px) scale(${.7+.3*e})`;
   $(k).style.width=(ease(ph(t,s,.35))*108)+'%';
 });
 // lista some, grafico entra
 const lo=1-ease(ph(t,6.7,.4));
 $('list').style.opacity=lo; $('list').style.display=lo<=0?'none':'block';
 const co=ease(ph(t,6.8,.4)), cf=1-ease(ph(t,9.0,.4));
 $('chart').style.opacity=(co*cf); 
 const g=(id,a,h0,y0)=>{const p=ease(ph(t,a,.55));const h=h0*p;$(id).setAttribute('y',y0+ (h0-h));$(id).setAttribute('height',Math.max(h,0.01));};
 g('b1',7.0,240,60);g('b2',7.2,144,156);g('b3',7.4,48,252);
 const lp=ease(ph(t,7.9,.9));$('ln').setAttribute('stroke-dashoffset',400*(1-lp));
 $('ar').setAttribute('opacity',lp>.97?1:0);
 ['t1','t2','t3'].forEach((id,i)=>$(id).setAttribute('opacity',ease(ph(t,7.1+i*.2,.4))));
 $('t4').setAttribute('opacity',ease(ph(t,8.5,.3)));
 const b4p=back(ph(t,8.4,.5));$('b4').setAttribute('y',300-6*b4p);
 // preco grande
 const pp=ph(t,9.0,.6),pe=back(pp);
 $('pv').style.opacity=cl(pp*3);$('pv').style.transform=`scale(${.4+.6*pe})`;
 const gl=cl(1-ph(t,9.0,1.6));
 $('pv').style.textShadow=`0 0 ${10+34*Math.sin(Math.PI*cl(ph(t,9.0,1.4)))}px rgba(201,162,78,${.8*(0.3+0.7*Math.sin(Math.PI*cl(ph(t,9.0,1.4))))})`;
 // preco sobe para dar espaco ao cartao
 const up=ease(ph(t,12.7,.5));
 $('pv').style.top=(130-100*up)+'px';
 $('pv').style.fontSize=(104-34*up)+'px';
 // cartao
 const cp=ph(t,13.2,.6),ce=back(cp);
 $('card').style.opacity=cl(cp*2.5);
 $('card').style.transform=`translateX(${(1-ease(cp))*340}px) rotate(${(1-ease(cp))*-12}deg)`;
 $('card').style.top='140px';
 const xp=back(ph(t,14.1,.45));$('x12').style.transform=`scale(${Math.max(xp,0)})`;
 $('cartxt').style.opacity=ease(ph(t,14.4,.4));
 // saida
 const out=1-ease(ph(t,16.1,.4));$('s').style.opacity=out;
}
window.render=render;render(0);
</script></body></html>
