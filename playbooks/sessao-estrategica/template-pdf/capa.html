<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:Playfair;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Playfair;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:Lora;src:url(node_modules/@fontsource/lora/files/lora-latin-400-normal.woff2)}
@page{size:A4;margin:0}
html,body{margin:0}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:210mm;height:297mm;background:#000;color:#fff;position:relative;overflow:hidden;font-family:Lora,serif;break-after:page}
.pg:last-child{break-after:auto}
.c1,.c2{position:absolute;border-radius:50%;background:#1b1712}
.c1{width:150mm;height:150mm;top:-70mm;left:-60mm}
.c2{width:170mm;height:170mm;bottom:-85mm;right:-70mm}
.in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24mm}
.logo{width:62mm;margin-top:40mm}
.k{margin-top:22mm;color:#C9A24E;letter-spacing:.32em;text-transform:uppercase;font-size:10pt}
h1{font-family:Playfair,serif;font-weight:700;font-size:38pt;line-height:1.1;margin:8mm 0 0}
h1 em{display:block;font-weight:400;font-style:italic;color:#C9A24E}
.line{width:60px;height:2px;background:#C9A24E;margin:10mm 0 8mm}
.name{font-family:Playfair;font-size:20pt}
.brand{color:#bdbdbd;font-size:11pt;margin-top:3mm}
.foot{margin-top:auto;margin-bottom:20mm;color:#9a9a9a;font-size:9.5pt;letter-spacing:.06em}
.foot b{color:#C9A24E;font-weight:400;letter-spacing:.22em;text-transform:uppercase;display:block;margin-bottom:2mm}
.back .logo{width:50mm;margin-top:85mm}
.back p{color:#d8d8d8;font-size:12pt;line-height:1.6;max-width:120mm;margin:12mm 0 0}
.back .links{margin-top:10mm;color:#C9A24E;font-size:11pt;line-height:2}
</style></head><body>
<div class="pg">
<div class="c1"></div><div class="c2"></div>
<div class="in">
<img class="logo" src="logo.png">
<div class="k">Sessão estratégica</div>
<h1>Direcional<em>estratégico</em></h1>
<div class="line"></div>
<div class="name">{{NOME}}</div>
<div class="brand">{{MARCA}}</div>
<div class="foot"><b>Recria</b>Sessão de {{DATA}}</div>
</div></div>
<div class="pg back">
<div class="c1"></div><div class="c2"></div>
<div class="in">
<img class="logo" src="logo.png">
<p>Te ajudamos a vender todo santo dia através da comunicação certa para as pessoas certas.</p>
<div class="links">agenciarecria.com.br/links<br>Instagram @agencia.recria</div>
</div></div>
</body></html>
